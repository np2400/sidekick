# docker compose up -d  : build (if needed) and start Sidekick in the background
# docker compose logs -f: follow its logs      docker compose down: stop it

# Docker keeps logs forever by default; cap each container at 3 files x 10 MB so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sidekick:
    build: .
    image: sidekick:local
    logging: *logging
    env_file: .env                 # secrets come from .env at run time, never from the image
    volumes:
      - ./data:/data               # the "locker": database + Google tokens survive rebuilds
    ports:
      - "127.0.0.1:8000:8000"      # only this machine can reach it; the tunnel (or Caddy) sits in front
    restart: unless-stopped        # come back after crashes and reboots

  # Server only: HTTPS front door. Starts when .env has COMPOSE_PROFILES=public and SIDEKICK_DOMAIN=...
  caddy:
    image: caddy:2.10-alpine
    profiles: [public]
    logging: *logging
    environment:
      SIDEKICK_DOMAIN: ${SIDEKICK_DOMAIN:-}
    ports:
      - "80:80"                    # Let's Encrypt checks you own the domain here; then redirects to 443
      - "443:443"                  # HTTPS: what Telegram connects to
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro             # home page + privacy policy
      - caddy_data:/data           # certificates: keep them, or Let's Encrypt rate-limits re-issuing
    restart: unless-stopped

  # Server only: continuous backup of the database to S3. Needs SIDEKICK_BACKUP_URL and _REGION in .env.
  litestream:
    image: litestream/litestream:0.5.15
    profiles: [public]
    logging: *logging
    command: replicate
    user: "10001:10001"            # same user as Sidekick, so it can read and checkpoint the database
    # Host network: lets Litestream reach the EC2 instance role (S3 permission, no keys on disk), while
    # the Sidekick container stays on Docker's network and can't.
    network_mode: host
    environment:
      SIDEKICK_BACKUP_URL: ${SIDEKICK_BACKUP_URL:-}
      SIDEKICK_BACKUP_REGION: ${SIDEKICK_BACKUP_REGION:-}
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped

volumes:
  caddy_data:
