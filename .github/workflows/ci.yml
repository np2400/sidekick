# Runs on every push to main and every pull request. If a job fails, GitHub marks the commit red.
# Only offline checks run here: no API keys, no network calls to models, no cost.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Lint for real bugs (undefined or unused names, syntax errors)"
        run: ruff check app evals tests deploy
      - name: "Offline tests (FakeWorld, scripted model, network blocked)"
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # On pull requests gitleaks lists the PR's commits through the GitHub API, which needs read access to PRs.
    # Read-only and only for this job: least privilege, even for CI.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web app type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "TypeScript check + production build (the same command the server runs)"
        run: npm run build

  # Only a commit that passed every job above is marked deployable. The server polls the `production` branch
  # (deploy/deploy.py) and deploys it, so nothing in GitHub needs access to the server.
  promote:
    name: Mark as deployable
    needs: [tests, secrets, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to move the production branch; nothing else
    steps:
      - uses: actions/checkout@v4
      - name: "Move production to this commit"
        run: git push origin "HEAD:refs/heads/production" --force
